name: GitHub V6 多并发注册

on:
  workflow_dispatch:
    inputs:
      task_count:
        description: "任务数量（留空自动使用邮箱池，最多 256）"
        required: false
        default: ""
        type: string
      max_parallel:
        description: "最大并发数量（1-20）"
        required: true
        default: "20"
        type: string
      form_timeout:
        description: "表单超时秒数（10-300）"
        required: true
        default: "60"
        type: string
      mail_timeout:
        description: "邮件超时秒数（30-900）"
        required: true
        default: "180"
        type: string
      success_timeout:
        description: "成功确认超时秒数（5-120）"
        required: true
        default: "30"
        type: string

concurrency:
  group: GitHub-V6-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: 准备任务矩阵
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.matrix.outputs.indices }}
      task_count: ${{ steps.matrix.outputs.task_count }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
      form_timeout: ${{ steps.matrix.outputs.form_timeout }}
      mail_timeout: ${{ steps.matrix.outputs.mail_timeout }}
      success_timeout: ${{ steps.matrix.outputs.success_timeout }}
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v6

      - name: 配置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 校验输入并生成矩阵
        id: matrix
        env:
          REQUESTED_TASK_COUNT: ${{ inputs.task_count }}
          REQUESTED_MAX_PARALLEL: ${{ inputs.max_parallel }}
          REQUESTED_FORM_TIMEOUT: ${{ inputs.form_timeout }}
          REQUESTED_MAIL_TIMEOUT: ${{ inputs.mail_timeout }}
          REQUESTED_SUCCESS_TIMEOUT: ${{ inputs.success_timeout }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from github_email_pool import (
              matrix_indices,
              resolve_max_parallel,
              resolve_task_count,
          )

          def bounded_seconds(label, raw, lower, upper):
              try:
                  value = int(raw)
              except (TypeError, ValueError) as exc:
                  raise SystemExit(f"{label}必须是整数") from exc
              if not lower <= value <= upper:
                  raise SystemExit(f"{label}必须在 {lower} 到 {upper} 之间")
              return value

          count = resolve_task_count("email.txt", os.environ["REQUESTED_TASK_COUNT"])
          parallel = resolve_max_parallel(
              os.environ["REQUESTED_MAX_PARALLEL"], count
          )
          form_timeout = bounded_seconds(
              "表单超时秒数", os.environ["REQUESTED_FORM_TIMEOUT"], 10, 300
          )
          mail_timeout = bounded_seconds(
              "邮件超时秒数", os.environ["REQUESTED_MAIL_TIMEOUT"], 30, 900
          )
          success_timeout = bounded_seconds(
              "成功确认超时秒数",
              os.environ["REQUESTED_SUCCESS_TIMEOUT"],
              5,
              120,
          )
          outputs = {
              "indices": json.dumps(matrix_indices(count), separators=(",", ":")),
              "task_count": str(count),
              "max_parallel": str(parallel),
              "form_timeout": str(form_timeout),
              "mail_timeout": str(mail_timeout),
              "success_timeout": str(success_timeout),
          }
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as stream:
              for key, value in outputs.items():
                  stream.write(f"{key}={value}\n")
          print(f"矩阵生成完成：任务 {count}，最大并发 {parallel}")
          PY

  register:
    name: 注册账号 ${{ matrix.index }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.indices) }}
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v6

      - name: 配置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 缓存 RuyiPage Firefox 运行时
        uses: actions/cache@v5
        with:
          path: ~/.cache/ruyipage
          key: ruyipage-firefox-${{ runner.os }}-v1

      - name: 安装 Python 依赖
        run: python -m pip install -r requirements.txt

      - name: 确保 RuyiPage Firefox 可用
        run: |
          if ! python -m ruyipage doctor >/dev/null 2>&1; then
            python -m ruyipage install
            python -m ruyipage doctor
          fi

      - name: 确保虚拟显示环境可用
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xauth >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb xauth
          fi

      - name: 执行注册任务
        id: registration
        timeout-minutes: 20
        run: |
          set +e
          output_dir="artifacts/job-${{ matrix.index }}"
          mkdir -p "$output_dir"
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python -u github_register_job.py \
              --邮箱文件 email.txt \
              --任务索引 "${{ matrix.index }}" \
              --输出目录 "$output_dir" \
              --最大尝试次数 1 \
              --表单超时秒数 "${{ needs.prepare.outputs.form_timeout }}" \
              --邮件超时秒数 "${{ needs.prepare.outputs.mail_timeout }}" \
              --成功确认超时秒数 "${{ needs.prepare.outputs.success_timeout }}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 上传任务结果
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GitHub-V6-注册结果-${{ matrix.index }}
          path: artifacts/job-${{ matrix.index }}
          if-no-files-found: error
          retention-days: 7

      - name: 标记失败任务
        if: steps.registration.outputs.exit_code != '0'
        run: |
          echo "当前邮箱的单次注册流程未完成，详细信息已上传。"
          exit 1

  collect:
    name: 汇总并回写邮箱池
    if: always()
    needs: [prepare, register]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出当前分支完整历史
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 配置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 下载全部任务结果
        uses: actions/download-artifact@v7
        with:
          pattern: GitHub-V6-注册结果-*
          path: artifacts
          merge-multiple: false

      - name: 汇总结果并安全推送
        env:
          EXPECTED_TASK_COUNT: ${{ needs.prepare.outputs.task_count }}
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          summary_file="$RUNNER_TEMP/github-v6-summary.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for push_attempt in 1 2 3; do
            echo "开始第 ${push_attempt}/3 次汇总推送"
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            : > "$summary_file"
            python github_result.py \
              --结果目录 artifacts \
              --邮箱文件 email.txt \
              --成功账号文件 注册成功账号.txt \
              --摘要文件 "$summary_file" \
              --预期任务数量 "$EXPECTED_TASK_COUNT"

            if git diff --quiet -- email.txt 注册成功账号.txt; then
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
              echo "没有需要提交的新结果。"
              exit 0
            fi

            git add -- email.txt 注册成功账号.txt
            git commit -m "更新 GitHub V6 注册结果"
            if git push origin "HEAD:$branch"; then
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
              echo "成功账号和邮箱池已推送。"
              exit 0
            fi
            echo "推送发生冲突，将基于远端最新分支重新汇总。"
          done

          echo "连续三次推送失败，邮箱池未被远端覆盖。"
          exit 1

      - name: 上传全部账号汇总
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ALL-全部账号-v6
          path: 注册成功账号.txt
          if-no-files-found: error
          retention-days: 7
